[project]
name = "langgraphnew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SAKSHAM RAJ", email = "139163750+SakshamRaj1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.10",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
    "tavily-python>=0.7",
]

[project.scripts]
langgraphnew = "langgraphnew:main"

[build-system]
