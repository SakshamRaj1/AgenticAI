[project]
name = "langchainnew"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SAKSHAM RAJ", email = "139163750+SakshamRaj1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gcloud>=0.18.3",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-google-vertexai>=3.2.5",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchainnew = "langchainnew:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
