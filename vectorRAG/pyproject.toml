[project]
name = "vectorrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SAKSHAM RAJ", email = "139163750+SakshamRaj1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "fonttools>=4.68.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "typesense>=2.1.1",
]

[project.scripts]
vectorrag = "vectorrag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
