[project]
name = "llmeval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SAKSHAM RAJ", email = "139163750+SakshamRaj1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langsmith>=0.14.17",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
llmeval = "llmeval:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
